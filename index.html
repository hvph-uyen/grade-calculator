<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Tính Điểm Trung Bình</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 Tính Điểm Trung Bình</h1>
            <p class="subtitle">Nhập điểm ba môn học của bạn</p>
            
            <form id="gradeForm" novalidate>
                <div class="form-group">
                    <label for="mathScore">Điểm Toán:</label>
                    <input 
                        type="text" 
                        id="mathScore" 
                        placeholder="Nhập điểm từ 0-10"
                        autocomplete="off"
                    >
                    <span class="error-message" id="mathError"></span>
                </div>

                <div class="form-group">
                    <label for="physicsScore">Điểm Vật Lý:</label>
                    <input 
                        type="text" 
                        id="physicsScore" 
                        placeholder="Nhập điểm từ 0-10"
                        autocomplete="off"
                    >
                    <span class="error-message" id="physicsError"></span>
                </div>

                <div class="form-group">
                    <label for="chemistryScore">Điểm Hóa Học:</label>
                    <input 
                        type="text" 
                        id="chemistryScore" 
                        placeholder="Nhập điểm từ 0-10"
                        autocomplete="off"
                    >
                    <span class="error-message" id="chemistryError"></span>
                </div>

                <button type="submit" class="btn-calculate">Tính Điểm Trung Bình</button>
            </form>

            <div id="resultContainer" class="result-container hidden">
                <div class="result-content">
                    <h2>📊 Kết Quả</h2>
                    <div class="result-item">
                        <span class="label">Điểm Trung Bình:</span>
                        <span class="average-score" id="averageScore">0.00</span>
                    </div>
                    <div class="result-item">
                        <span class="label">Xếp Loại:</span>
                        <span class="classification" id="classification">-</span>
                    </div>
                    <button type="button" class="btn-reset" onclick="resetForm()">Tính Lại</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
